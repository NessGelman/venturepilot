<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Clearing cache...</title></head>
<body>
<p style="font-family:sans-serif;padding:40px">Clearing old cache, please wait...</p>
<script>
(async function() {
  if ('serviceWorker' in navigator) {
    const regs = await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map(r => r.unregister()));
  }
  const keys = await caches.keys();
  await Promise.all(keys.map(k => caches.delete(k)));
  window.location.replace('/venturepilot/');
})();
</script>
</body>
</html>
